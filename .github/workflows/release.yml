# Releases from the default branch, dispatched by a maintainer. With pending changesets it opens
# (or updates) the version PR; once that PR is merged, it checks and publishes the exact packed
# tarballs with npm trusted publishing (OIDC, no npm token) and provenance, then tags, creates
# GitHub releases and publishes server.json to the MCP Registry. A dry run (the default) versions
# temporarily in the runner, prepares and packs, and creates nothing. npm checks this filename:
# keep it `release.yml`.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Verify the release without opening the version PR or publishing
        type: boolean
        default: true

permissions: {}

# Serialized and never cancelled: a cancelled publish can leave a partial release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.mode.outputs.publish-plan-artifact-id }}
    steps:
      # Full history and tags: the publish plan skips versions that are already tagged.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ignore-scripts: "true"
      - uses: changesets/action/select-mode@v2.1.2
        id: mode
      - name: Write the job summary
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          {
            echo "### Release plan"
            echo "Mode: \`$MODE\` (version: open the version PR; publish: publish the versions on main; none: nothing to release)."
            if [ "$DRY_RUN" = true ]; then echo "Dry run: verify only; nothing is pushed or published."; fi
          } >> "$GITHUB_STEP_SUMMARY"

  version:
    needs: plan
    if: ${{ !inputs.dry-run && needs.plan.outputs.mode == 'version' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the version commit on changeset-release/main
      pull-requests: write # the version PR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ignore-scripts: "true"
      # Commits through the GitHub API with the workflow token (signed by GitHub).
      - uses: changesets/action/version@v2.1.2
        with:
          script: pnpm release:version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"

  prepare:
    needs: plan
    if: ${{ inputs.dry-run || needs.plan.outputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # No dependency cache in the release: everything comes from the lockfile and the registry.
      - uses: ./.github/actions/setup

      - name: Version in the runner (dry run)
        if: inputs.dry-run
        run: |
          if ! find .changeset -maxdepth 1 -name '*.md' ! -name README.md | grep -q .; then
            printf '%s\n' '---' '"@thenamespace/ens-mcp": patch' '---' '' 'Release dry run.' \
              > .changeset/release-dry-run.md
          fi
          pnpm release:version
          git diff --stat

      - run: pnpm check && pnpm pack:check

      # Packs the publish plan from the plan job; a dry run packs the versions made above.
      - uses: changesets/action/pack@v2.1.2
        id: pack
        with:
          publish-plan-artifact-id: ${{ !inputs.dry-run && needs.plan.outputs.publish-plan-artifact-id || '' }}
      - name: Write the job summary
        env:
          PACK_ARTIFACT_ID: ${{ steps.pack.outputs.pack-dir-artifact-id }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          {
            echo "### Release candidate"
            echo "Run ID: \`$GITHUB_RUN_ID\` · packed artifact ID: \`$PACK_ARTIFACT_ID\`"
            if [ "$DRY_RUN" = true ]; then echo "Dry run: these versions exist only in this runner."; fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [plan, prepare]
    if: ${{ !inputs.dry-run && needs.plan.outputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # tags and GitHub releases
      id-token: write # npm trusted publishing, provenance and the MCP Registry login
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ignore-scripts: "true"
      # Publishes the checked archives as they are: nothing is rebuilt.
      - uses: changesets/action/publish@v2.1.2
        id: publish
        with:
          pack-dir-artifact-id: ${{ needs.prepare.outputs.pack-dir-artifact-id }}
          create-github-releases: true
          push-git-tags: true
        env:
          NPM_CONFIG_PROVENANCE: "true"
          PNPM_CONFIG_PROVENANCE: "true"
      # The registry holds metadata only: server.json, versioned like the npm package just published.
      - name: Publish to the MCP Registry
        if: contains(steps.publish.outputs.published-packages, '"@thenamespace/ens-mcp"')
        env:
          PUBLISHED: ${{ steps.publish.outputs.published-packages }}
          MCP_PUBLISHER_VERSION: "1.8.9"
          MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher

          version=$(jq -r '.[] | select(.name == "@thenamespace/ens-mcp") | .version' <<< "$PUBLISHED")
          cd packages/ens-mcp
          jq --arg version "$version" '.version = $version | .packages[0].version = $version' \
            server.json > "$RUNNER_TEMP/server.json"
          mv "$RUNNER_TEMP/server.json" server.json
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
      - name: Write the job summary
        if: always()
        env:
          PUBLISHED: ${{ steps.publish.outputs.published-packages }}
        run: |
          {
            echo "### Published"
            printf '%s\n' "${PUBLISHED:-[]}" | jq -r '.[] | "- \(.name)@\(.version)"'
          } >> "$GITHUB_STEP_SUMMARY"
