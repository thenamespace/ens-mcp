# Builds the server image (Dockerfile), pushes it to Artifact Registry and asks thenamespace/infra
# to roll it out. Dispatch it from main. Images are tagged with the short commit SHA, which is the
# tag infra deploys, and `latest`.
name: Deploy

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP_NAME: ${{ github.event.repository.name }}
  GCP_PROJECT_ID: prod-9427
  GCP_REGION: europe-west3
  ENVIRONMENT: prod

jobs:
  build-and-push:
    name: Build and push
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Workload Identity Federation with Google Cloud
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Image tag
        id: meta
        run: echo "image_tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push the image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMAGE:$IMAGE_TAG" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"
          echo "Pushed \`$IMAGE:$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"

  update-image-tag:
    name: Update image tag in infra
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.REPOSITORY_DISPATCH_PAT }}
          repository: thenamespace/infra
          event-type: image-tag-update
          client-payload: >-
            {"repository": "${{ env.APP_NAME }}",
            "image_tag": "${{ needs.build-and-push.outputs.image_tag }}",
            "environment": "${{ env.ENVIRONMENT }}"}
