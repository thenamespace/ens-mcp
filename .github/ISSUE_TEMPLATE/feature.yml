name: Feature request
description: Propose a new tool, resource, prompt or client integration.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you want an assistant to do with ENS that ens-mcp does not let it do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The tool you would like, with its inputs and the result it returns.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds
      description: What you do today instead, if anything.
